
<script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQZQJs1zWzHSQ2aTtq-jrQjK-Rib2Qig2dVpPiFyE4Yvhh6gFl-HD8WTHaEIia2m3fwvB9ti5t3is5r/pub?output=csv';
    const PHONE_NUMBER = '5212222051026';

    // Productos de respaldo por si falla la conexión
    const fallbackProducts = [
      { SKU: 'CAD-001', Nombre: 'Cadena de oro', Categoria: 'Cadenas', Precio: '450', Imagen_URL: 'https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=500' }
    ];

    function loadProductsFromSheets() {
      Papa.parse(SHEET_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          if (results.data && results.data.length > 0) {
            renderProducts(results.data);
          } else {
            renderProducts(fallbackProducts);
          }
        },
        error: function(err) {
          console.error("Error al conectar con Sheets, cargando respaldo:", err);
          renderProducts(fallbackProducts);
        }
      });
    }

    function renderProducts(products) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      products.forEach(p => {
        const sku = p.SKU || p.sku || 'N/A';
        const name = p.Nombre || p.nombre || 'Producto';
        const category = p.Categoria || p.categoria || 'General';
        const price = p.Precio || p.precio || '0';
        const image = p.Imagen_URL || p.imagen_url || 'https://via.placeholder.com/400';

        const message = encodeURIComponent(¡Hola! Me interesa comprar el producto: ${name} (SKU: ${sku}) con precio de $${price} MXN.);
        const whatsappUrl = https://wa.me/${PHONE_NUMBER}?text=${message};

        grid.innerHTML += `
          <div class="product-card bg-white border border-amber-100 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between" data-name="${name.toLowerCase()}">
            <div class="relative overflow-hidden bg-gray-100 aspect-square">
              <img src="${image}" alt="${name}" class="w-full h-full object-cover">
            </div>
            <div class="p-4 flex-1 flex flex-col justify-between">
              <div>
                <span class="text-[10px] uppercase tracking-wider font-semibold text-amber-600">${category}</span>
                <h3 class="font-medium text-gray-800 text-sm mt-1 line-clamp-2">${name}</h3>
              </div>
              <div class="mt-4">
                <p class="text-lg font-bold text-gray-900">$${price} <span class="text-xs font-normal text-gray-500">MXN</span></p>
                <a href="${whatsappUrl}" target="_blank" class="mt-3 w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2 px-3 rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition-colors">
                  <i class="fa-brands fa-whatsapp text-sm"></i> Pedir por WhatsApp
                </a>
              </div>
            </div>
          </div>
        `;
      });
    }

    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const cards = document.querySelectorAll('.product-card');
      cards.forEach(card => {
        const name = card.getAttribute('data-name');
        card.style.display = name.includes(query) ? 'flex' : 'none';
      });
    }

    loadProductsFromSheets();
  </script>
