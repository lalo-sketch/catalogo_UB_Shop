
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UB Shop - Catálogo & Accesorios</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fdfbf7; }
    h1, h2, h3, .brand-font { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="text-gray-800 antialiased">

  <header class="bg-white border-b border-amber-100 sticky top-0 z-50 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-4 text-center">
      <h1 class="text-3xl font-bold tracking-wide text-amber-900">UB Shop</h1>
      <p class="text-xs uppercase tracking-widest text-amber-600 mt-1">Joyería & Accesorios</p>
    </div>
    
    <div class="max-w-6xl mx-auto px-4 pb-4 pt-2">
      <div class="relative">
        <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Buscar joyas, gorras, cadenas..." 
               class="w-full pl-10 pr-4 py-2 bg-amber-50/50 border border-amber-200 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-amber-400"></i>
      </div>
    </div>
  </header>

  <main class="max-w-6xl mx-auto px-4 py-8">
    <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
      <p class="col-span-full text-center text-gray-500 py-10">Cargando catálogo en tiempo real...</p>
    </div>
  </main>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQZQJs1zWzHSQ2aTtq-jrQjK-Rib2Qig2dVpPiFyE4Yvhh6gFl-HD8WTHaEIia2m3fwvB9ti5t3is5r/pub?output=csv';
    const PHONE_NUMBER = '5212222051026';
    const DEFAULT_IMAGE = 'https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=500';

    function loadProductsFromSheets() {
      Papa.parse(SHEET_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          if (results.data && results.data.length > 0) {
            renderProducts(results.data);
          } else {
            document.getElementById('productGrid').innerHTML = '<p class="col-span-full text-center text-gray-500 py-10">No hay productos disponibles.</p>';
          }
        },
        error: function(err) {
          console.error("Error al conectar con Sheets:", err);
          document.getElementById('productGrid').innerHTML = '<p class="col-span-full text-center text-red-500 py-10">Error al cargar el catálogo.</p>';
        }
      });
    }

    function renderProducts(products) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      products.forEach(p => {
        // Normalizamos las llaves de la fila para evitar errores por mayúsculas o espacios
        const keys = Object.keys(p);
        const getVal = (target) => {
          const foundKey = keys.find(k => k.trim().toLowerCase() === target.toLowerCase());
          return foundKey ? p[foundKey] : '';
        };

        const sku = getVal('SKU') || 'N/A';
        const name = getVal('Nombre') || 'Producto';
        const category = getVal('Categoria') || 'General';
        const price = getVal('Precio') || '0';
        let image = getVal('Imagen_URL') || getVal('Imagen') || DEFAULT_IMAGE;

        // Si la celda viene vacía o no es válida, usamos la imagen por defecto
        if (!image || image.trim() === '' || !image.startsWith('http')) {
          image = DEFAULT_IMAGE;
        }

        const message = encodeURIComponent(¡Hola! Me interesa comprar el producto: ${name} (SKU: ${sku}) con precio de $${price} MXN.);
