  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQZQJs1zkzH5Q2aTtq-irQJk-Rib2QTg2dVpPifyE4YVhh6gf1-HD8wTHeMia2m3fuB9ti5t3is5r/pub?output=csv';
    const PHONE_NUMBER = '521222051026';
    const fallbackImg = 'https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=500';

    let allProducts = [];

    // Parseador manual para cadenas CSV
    function parseCSVLine(line) {
      const values = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          values.push(current.trim().replace(/^"|"$/g, ''));
          current = '';
        } else {
          current += char;
        }
      }
      values.push(current.trim().replace(/^"|"$/g, ''));
      return values;
    }

    function parseCSV(text) {
      const rawLines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      if (rawLines.length < 2) return [];

      const headers = parseCSVLine(rawLines[0]).map(h => h.toLowerCase().trim());

      const products = [];
      for (let i = 1; i < rawLines.length; i++) {
        const values = parseCSVLine(rawLines[i]);
        let obj = {};
        headers.forEach((h, index) => {
          obj[h] = values[index] || '';
        });
        products.push(obj);
      }
      return products;
    }

    // Renderizar las tarjetas de productos

      const grid = document.getElementById('productGrid');
      if (!grid) return;

      if (!Array.isArray(items) || items.length === 0) {
        grid.innerHTML = '<p class="text-amber-400 text-center col-span-full py-10">No se encontraron productos en el catálogo.</p>';
        return;
      }

      let html = '';

      items.forEach(item => {
        const imgSrc = item.image
