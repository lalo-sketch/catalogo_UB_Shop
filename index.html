
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UB Shop - Joyería & Accesorios</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Íconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PapaParse para Google Sheets -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');
    
    body { 
      font-family: 'Plus Jakarta Sans', sans-serif; 
      background-color: #0a0a0a; 
      color: #e5e5e5;
    }

    .gold-button {
      background: linear-gradient(135deg, #D4AF37 0%, #AA771C 100%);
      color: #000;
    }

    .gold-button:hover {
      background: linear-gradient(135deg, #FCF6BA 0%, #D4AF37 100%);
    }

    .gold-gradient-text {
      background: linear-gradient(135deg, #BF953F 0%, #FCF6BA 25%, #B38728 50%, #FBF5B7 75%, #AA771C 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
  </style>
</head>
<body class="antialiased selection:bg-amber-500 selection:text-black">

  <!-- ENCABEZADO CON LOGO OFICIAL -->
  <header class="bg-neutral-900/90 backdrop-blur-md border-b border-amber-500/30 sticky top-0 z-50 shadow-2xl">
    <div class="max-w-6xl mx-auto px-4 py-4 text-center flex flex-col items-center justify-center">
      
      <!-- LOGO (Apuntando a logo.jpeg o logo.jpg) -->
      <img src="logo.jpeg" alt="UB Shop" class="h-28 md:h-36 object-contain hover:scale-105 transition-transform duration-300" onerror="this.src='logo.jpg'">

      <p class="text-[10px] md:text-xs uppercase tracking-[0.3em] text-amber-200/60 mt-1 font-semibold">
        Joyería & Accesorios Exclusivos
      </p>
    </div>
    
    <!-- BARRA DE BÚSQUEDA -->
    <div class="max-w-2xl mx-auto px-4 pb-5 pt-1">
      <div class="relative">
        <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Buscar en el catálogo exclusivo..." 
               class="w-full pl-11 pr-4 py-2.5 bg-neutral-950 border border-amber-500/30 rounded-full text-sm text-amber-100 placeholder-neutral-500 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition-all">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-amber-500/70"></i>
      </div>
    </div>
  </header>

  <!-- SECCIÓN DE PRODUCTOS -->
  <main class="max-w-6xl mx-auto px-4 py-10">
    <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 md:gap-7">
      <!-- Tarjetas de producto cargadas dinámicamente -->
    </div>
  </main>

<script>
  // Pega aquí la URL de 'Publicar en la web' (.csv) de tu hoja actual
  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQZQJs1zkzH5Q2aTtq-irQJk-Rib2QIg2dVpPifyE4Yvhh6gf1-HD8wTHeMia2m3fwB9ti5t3is5r/pub?output=csv';
  const PHONE_NUMBER = '521222051026';

  function drawCards(items) {
    const grid = document.getElementById('productGrid');
    if (!grid) return;

    if (!Array.isArray(items) || items.length === 0) {
      grid.innerHTML = '<p class="text-amber-400 text-center col-span-full py-10">La hoja de Google Sheets está vacía o no tiene productos.</p>';
      return;
    }

    let html = '';

    items.forEach(item => {
      if (!item || typeof item !== 'object') return;

      const getAttr = (key) => {
        const matchedKey = Object.keys(item).find(k => k.trim().toLowerCase() === key.toLowerCase());
        return matchedKey ? item[matchedKey] : '';
      };

      const sku = getAttr('sku') || 'N/A';
      const name = getAttr('nombre');
      const category = getAttr('categoria') || 'Joyería';
      const price = getAttr('precio') || '0';
      const img = getAttr('imagen') || getAttr('imagen_url');

      if (!name || name.trim() === '') return;

      const message = encodeURIComponent(Hola, me interesa el producto: ${name} (SKU: ${sku}) con precio $${price});
      const waUrl = https://wa.me/${PHONE_NUMBER}?text=${message};

      const imageHTML = (img && img.trim() !== '') 
        ? <img src="${img.trim()}" alt="${name}" class="w-full h-48 object-cover rounded-xl mb-4" onError="this.src='https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=500'">
        : <div class="w-full h-48 bg-neutral-800 rounded-xl mb-4 flex items-center justify-center text-xs text-neutral-500">Sin imagen</div>;

      html += `
        <div class="bg-neutral-900 border border-amber-500/20 rounded-2xl overflow-hidden hover:border-amber-400/50 transition-all duration-300 flex flex-col justify-between p-4">
          ${imageHTML}
          <div class="flex-1">
            <span class="text-xs text-amber-400 uppercase tracking-widest">${category}</span>
            <h3 class="text-lg font-bold text-white mb-1">${name}</h3>
            <p class="text-sm text-neutral-400 mb-3">SKU: ${sku}</p>
          </div>
          <div class="flex items-center justify-between pt-3 border-t border-neutral-800">
            <span class="text-xl font-extrabold text-amber-300">$${price}</span>
            <a href="${waUrl}" target="_blank" class="bg-amber-500 hover:bg-amber-400 text-black font-semibold px-4 py-2 rounded-xl text-sm transition-colors">
              Pedir
            </a>
          </div>
        </div>
      `;
    });

    grid.innerHTML = html;
  }

  // Petición directa y segura
  fetch(SHEET_CSV_URL)
    .then(response => {
      if (!response.ok) throw new Error('No se pudo acceder al enlace del CSV');
      return response.text();
    })
    .then(csvText => {
      if (window.Papa) {
        const parsed = Papa.parse(csvText, { header: true, skipEmptyLines: true });
        drawCards(parsed.data);
      } else {
        throw new Error('La librería PapaParse no está cargada en el HTML');
      }
    })
    .catch(error => {
      console.error('Error:', error);
      const grid = document.getElementById('productGrid');
      if (grid) {
        grid.innerHTML = <p class="text-red-400 text-center col-span-full py-10">Error de conexión: ${error.message}</p>;
      }
    });
</script>
