
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UB Shop - Joyería & Accesorios</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- FontAwesome Íconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- PapaParse para Google Sheets -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cdnjs/5.3.2/papaparse.min.js"></script>
  
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen">

  <!-- HEADER -->
  <header class="py-6 border-b border-neutral-800 text-center">
    <div class="flex justify-center items-center mb-2">
      <img src="logo.jpg" alt="UB Shop" class="h-28 md:h-36 object-contain hover:scale-105 transition-transform duration-300" onerror="this.src='logo.jpeg'">
    </div>
    <p class="text-[10px] md:text-xs uppercase tracking-[0.3em] text-amber-200/60 font-semibold">
      Joyería & Accesorios Exclusivos
    </p>

    <!-- BARRA DE BÚSQUEDA -->
    <div class="max-w-2xl mx-auto px-4 pb-5 pt-4">
      <div class="relative">
        <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Buscar en el catálogo exclusivo..." class="w-full pl-11 pr-4 py-2.5 bg-neutral-950 border border-amber-500/30 rounded-full text-sm text-amber-100 placeholder-neutral-500 focus:outline-none focus:border-amber-400 focus:ring-1 focus:ring-amber-400 transition-all">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-amber-500/70"></i>
      </div>
    </div>
  </header>

  <!-- SECCIÓN DE PRODUCTOS -->
  <main class="max-w-6xl mx-auto px-4 py-10">
    <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 md:gap-7">
      <p class="text-amber-400 text-center col-span-full py-10">Cargando catálogo...</p>
    </div>
  </main>

  <script>
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQZQJs1zkzH5Q2aTtq-irQJk-Rib2QIg2dVpPifyE4Yvhh6gf1-HD8wTHeMia2m3fwB9ti5t3is5r/pub?output=csv';
    const PHONE_NUMBER = '521222051026';
    const fallbackImg = 'https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=500';

    let allProducts = [];

    function drawCards(items) {
      const grid = document.getElementById('productGrid');
      if (!grid) return;

      if (!Array.isArray(items) || items.length === 0) {
        grid.innerHTML = '<p class="text-amber-400 text-center col-span-full py-10">No hay productos disponibles en la hoja.</p>';
        return;
      }

      let html = '';

      items.forEach(item => {
        if (!item || typeof item !== 'object') return;

        const getAttr = (key) => {
          const matchedKey = Object.keys(item).find(k => k.trim().toLowerCase() === key.toLowerCase());
          return matchedKey ? item[matchedKey] : '';
        };

        const sku = getAttr('sku') || 'N/A';
        const name = getAttr('nombre');
        const category = getAttr('categoria') || 'Joyería';
        const price = getAttr('precio') || '0';
        const img = getAttr('imagen') || getAttr('imagen_url');

        if (!name || name.trim() === '') return;

        const message = encodeURIComponent('Hola, me interesa el producto: ' + name + ' (SKU: ' + sku + ') con precio $' + price);
        const waUrl = 'https://wa.me/' + PHONE_NUMBER + '?text=' + message;

        const imgSrc = (img && img.trim() !== '') ? img.trim() : fallbackImg;

        html += `
          <div class="bg-neutral-900 border border-amber-500/20 rounded-2xl overflow-hidden hover:border-amber-400/50 transition-all duration-300 flex flex-col justify-between p-4">
            <img src="${imgSrc}" alt="${name}" class="w-full h-48 object-cover rounded-xl mb-4" onerror="this.src='${fallbackImg}'">
            <div class="flex-1">
