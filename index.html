
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - Joyería & Accesorios</title>
  <!-- Tailwind CSS para el diseño -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- PapaParse para leer el CSV de Google Sheets fácilmente -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.3.2/papaparse.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fdfbf7; }
    h1, h2, h3, .brand-font { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="text-gray-800 antialiased">

  <!-- ENCABEZADO / BRANDING -->
  <header class="bg-white border-b border-amber-100 sticky top-0 z-50 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-4 text-center">
      <h1 class="text-3xl font-bold tracking-wide text-amber-900">AURORA</h1>
      <p class="text-xs uppercase tracking-widest text-amber-600 mt-1">Joyería & Accesorios</p>
    </div>
    
    <!-- BARRA DE BÚSQUEDA -->
    <div class="max-w-6xl mx-auto px-4 pb-4 pt-2">
      <div class="relative">
        <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Buscar joyas, gorras, cadenas..." 
               class="w-full pl-10 pr-4 py-2 bg-amber-50/50 border border-amber-200 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-amber-400"></i>
      </div>
    </div>
  </header>

  <!-- CONTENEDOR DE PRODUCTOS -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
      <p class="col-span-full text-center text-gray-500 py-10">Cargando catálogo en tiempo real...</p>
    </div>
  </main>

  <script>
    // TU LINK DE GOOGLE SHEETS
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQZQJs1zWzHSQ2aTtq-jrQjK-Rib2Qig2dVpPiFyE4Yvhh6gFl-HD8WTHaEIia2m3fwvB9ti5t3is5r/pub?output=csv';
    
    // CAMBIA ESTE NÚMERO POR EL TELÉFONO DEL CLIENTE (Con clave de país, ej. 521222XXXXXXX)
    const PHONE_NUMBER = '5212222051026'; 

    function loadProductsFromSheets() {
      Papa.parse(SHEET_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          renderProducts(results.data);
        },
        error: function(err) {
          console.error("Error cargando el Sheets:", err);
          document.getElementById('productGrid').innerHTML = '<p class="col-span-full text-center text-red-500">Error al cargar productos. Revisa la hoja de cálculo.</p>';
        }
      });
    }

    function renderProducts(products) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      if (products.length === 0) {
        grid.innerHTML = '<p class="col-span-full text-center text-gray-500">No hay productos registrados en la hoja de cálculo.</p>';
        return;
      }

      products.forEach(p => {
        // Aseguramos variables limpias
        const sku = p.SKU || p.sku || 'N/A';
        const name = p.Nombre || p.nombre || 'Producto';
        const category = p.Categoria || p.categoria || 'General';
        const price = p.Precio || p.precio || '0';
        const image = p.Imagen_URL || p.imagen_url || 'https://via.placeholder.com/400';

        const message = encodeURIComponent(¡Hola! Me interesa comprar el producto: ${name} (SKU: ${sku}) con precio de $${price} MXN.);
        const whatsappUrl = https://wa.me/${PHONE_NUMBER}?text=${message};

        grid.innerHTML += `
          <div class="product-card bg-white border border-amber-100 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-all
