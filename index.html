
<script>
  const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQZQJs1zWzHSQ2aTtq-jrQjK-Rib2Qig2dVpPiFyE4Yvhh6gFl-HD8WTHaEIia2m3fwvB9ti5t3is5r/pub?output=csv';
  const PHONE_NUMBER = '5212222051026';
  const fallbackImg = 'https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=500';

  const localProducts = [
    { SKU: 'CAD-001', Nombre: 'Cadena de oro', Categoria: 'Cadenas', Precio: '450', Imagen_URL: fallbackImg },
    { SKU: 'CAD-002', Nombre: 'Cadena de plata', Categoria: 'Cadenas', Precio: '500', Imagen_URL: 'https://images.unsplash.com/photo-1626379965592-dc26158305f8?w=500' }
  ];

  function drawCards(items) {
    const grid = document.getElementById('productGrid');
    if (!grid || !Array.isArray(items) || items.length === 0) return;

    let html = '';

    items.forEach(item => {
      if (!item || typeof item !== 'object') return;

      const getAttr = (key) => {
        const matchedKey = Object.keys(item).find(k => k.trim().toLowerCase() === key.toLowerCase());
        return matchedKey ? item[matchedKey] : '';
      };

      const sku = getAttr('sku') || 'N/A';
      const name = getAttr('nombre') || 'Producto';
      const category = getAttr('categoria') || 'Joyería';
      const price = getAttr('precio') || '0';
      const img = getAttr('imagen_url') || getAttr('imagen') || fallbackImg;

      const msg = encodeURIComponent(Hola, me interesa obtener información sobre: ${name} (SKU: ${sku}).);
      const waUrl = https://wa.me/${PHONE_NUMBER}?text=${msg};

      html += `
        <div class="bg-neutral-900 border border-amber-500/20 rounded-xl overflow-hidden shadow-lg hover:border-amber-500/50 transition">
          <img src="${img}" alt="${name}" class="w-full h-48 object-cover" onError="this.src='${fallbackImg}'">
          <div class="p-4 flex flex-col justify-between">
            <div>
              <span class="text-xs text-amber-500/80 uppercase tracking-wider font-semibold">${category}</span>
              <h3 class="text-lg font-bold text-amber-100 mt-1">${name}</h3>
              <p class="text-xs text-neutral-400 mt-0.5">SKU: ${sku}</p>
            </div>
            <div class="mt-4 flex items-center justify-between">
              <span class="text-xl font-black text-amber-400">$${price} MXN</span>
              <a href="${waUrl}" target="_blank" class="bg-amber-500 hover:bg-amber-400 text-neutral-950 px-3 py-1.5 rounded-lg text-xs font-bold transition">
                Pedir
              </a>
            </div>
          </div>
        </div>
      `;
    });

    grid.innerHTML = html;
  }

  async function loadData() {
    try {
      const res = await fetch(SHEET_CSV_URL);
      if (!res.ok) throw new Error('HTTP status ' + res.status);
      
      const csvText = await res.text();
      const lines = csvText.split('\n').map(l => l.trim()).filter(Boolean);

      if (lines.length <= 1) {
        drawCards(localProducts);
        return;
      }

      const headers = lines[0].split(',').map(h => h.trim());
      const parsedItems = lines.slice(1).map(line => {
        const values = line.split(',');
        const obj = {};
        headers.forEach((h, i) => {
          obj[h] = values[i] ? values[i].trim() : '';
        });
        return obj;
      });

      drawCards(parsedItems);
    } catch (err) {
      console.error('Error al cargar Sheets, usando backup:', err);
      drawCards(localProducts);
    }
  }

  document.addEventListener('DOMContentLoaded', loadData);
</script>
