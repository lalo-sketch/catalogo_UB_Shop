
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UB Shop - Joyería & Accesorios</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- FontAwesome Íconos -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap');
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
  </style>
</head>
<body class="bg-black text-white min-h-screen bg-cover bg-center bg-no-repeat bg-fixed" style="background-image: url('fondo.jpg');">

  <div class="min-h-screen bg-black/85 backdrop-blur-xs">
    
    <!-- HEADER -->
    <header class="py-6 border-b border-neutral-800/80 text-center bg-black/60">
      <div class="flex justify-center items-center mb-2">
        <img src="logo.jpg" alt="UB Shop" class="h-28 md:h-36 object-contain hover:scale-105 transition-transform duration-300" onerror="this.src='logo.jpeg'">
      </div>
      <p class="text-[10px] md:text-xs uppercase tracking-[0.2em] text-amber-200/60 font-semibold">
        Joyería & Accesorios Exclusivos
      </p>
    </header>

    <!-- BARRA DE BÚSQUEDA -->
    <div class="max-w-2xl mx-auto px-4 pb-5 pt-4">
      <div class="relative">
        <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Buscar en el catálogo exclusivo..." class="w-full pl-11 pr-4 py-2.5 bg-neutral-950/90 border border-amber-500/30 rounded-full text-sm text-amber-100 placeholder-neutral-500 focus:outline-none focus:border-amber-400">
        <i class="fa-solid fa-magnifying-glass absolute left-4 top-3.5 text-amber-500/70"></i>
      </div>
    </div>

    <!-- SECCIÓN DE PRODUCTOS -->
    <main class="max-w-6xl mx-auto px-4 py-10">
      <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-5 md:gap-7">
        <p class="text-amber-400 text-center col-span-full py-10 font-medium">Cargando catálogo...</p>
      </div>
    </main>

  </div>

 <script>
    // Enlace público de Google Sheets en formato CSV
    const SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQZQJs1zWzHSQ2aTtq-jrQjK-Rib2Qig2dVpPiFyE4Yvhh6gFl-HD8WTHaEIia2m3fwvB9ti5t3is5r/pub?output=csv';
    const PHONE_NUMBER = '521234567890'; // Pon aquí tu número de WhatsApp
    const fallbackImg = 'https://via.placeholder.com/300x300?text=Sin+Imagen';

    let allProducts = [];

    // Parseador manual para líneas CSV
    function parseCSVLine(line) {
      const values = [];
      let current = '';
      let inQuotes = false;
      for (let i = 0; i < line.length; i++) {
        const char = line[i];
        if (char === '"') {
          inQuotes = !inQuotes;
        } else if (char === ',' && !inQuotes) {
          values.push(current.trim().replace(/^"|"$/g, ''));
          current = '';
        } else {
          current += char;
        }
      }
      values.push(current.trim().replace(/^"|"$/g, ''));
      return values;
    }

    // Convertir el texto CSV completo a objetos JSON
    function parseCSV(text) {
      const rawLines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l.length > 0);
      if (rawLines.length < 2) return [];

      const headers = parseCSVLine(rawLines[0]).map(h => h.toLowerCase().trim());

      const products = [];
      for (let i = 1; i < rawLines.length; i++) {
        const values = parseCSVLine(rawLines[i]);
        let obj = {};
        headers.forEach((h, index) => {
          obj[h] = values[index] || '';
        });
        products.push(obj);
      }
      return products;
    }
   // Convertir enlaces de Google Drive a URLs de imagen directas
function formatImageUrl(url) {
  if (!url) return fallbackImg;
  
  if (url.includes('drive.google.com')) {
    const idMatch = url.match(/\/d\/([a-zA-Z0-9_-]+)/) || url.match(/id=([a-zA-Z0-9_-]+)/);
    if (idMatch && idMatch[1]) {
      return https://lhs3.googleusercontent.com/d/${idMatch[1]};
    }
  }
  
  return url.startsWith('http') ? url : fallbackImg;
}

    // Renderizar las tarjetas de productos
    function drawCards(items) {
      const grid = document.getElementById('productGrid');
      if (!grid) return;

      if (!Array.isArray(items) || items.length === 0) {
        grid.innerHTML = '<p class="text-amber-400 text-center col-span-full py-10">No se encontraron productos en el catálogo.</p>';
        return;
      }

      let html = '';

      items.forEach(item => {
        const imgSrc = formatImageUrl(item.imagen);
        const whatsappMsg = encodeURIComponent(`Hola, me interesa obtener información sobre: ${item.nombre || 'un producto'}`);
        const waLink =`https://wa.me/${PHONE_NUMBER}?text=${whatsappMsg}`;

        html += `
          <div class="bg-neutral-900/90 rounded-xl p-4 border border-amber-500/20 flex flex-col justify-between hover:border-amber-500/50 transition-all">
            <div>
              <img src="${imgSrc}" alt="${item.nombre || 'Producto'}" class="w-full h-48 object-cover rounded-lg mb-3">
              <h3 class="text-base font-bold text-white mb-1">${item.nombre || 'Sin nombre'}</h3>
              <p class="text-amber-200/70 text-xs mb-3 font-medium uppercase tracking-wider">${item.categoria || ''}</p>
            </div>
            <div class="flex justify-between items-center mt-2 pt-2 border-t border-neutral-800">
              <span class="text-emerald-400 font-bold text-lg">${item.precio ? '$' + item.precio : ''}</span>
              <a href="${waLink}" target="_blank" class="bg-amber-500 hover:bg-amber-600 text-black font-semibold px-3 py-1.5 rounded-lg text-xs transition-colors flex items-center gap-1">
                <i class="fa-brands fa-whatsapp text-sm"></i> Pedir
              </a>
            </div>
          </div>
        `;
      });

      grid.innerHTML = html;
    }
   // Filtrar productos desde la barra de búsqueda
    function filterProducts() {
      const query = document.getElementById('searchInput').value.toLowerCase();
      const filtered = allProducts.filter(item => {
        const nameMatch = item.nombre && item.nombre.toLowerCase().includes(query);
        const catMatch = item.categoria && item.categoria.toLowerCase().includes(query);
        return nameMatch || catMatch;
      });
      drawCards(filtered);
    }

    // Función principal para obtener y cargar datos desde Google Sheets
    async function loadProducts() {
      try {
        const response = await fetch(SHEET_CSV_URL);
        if (!response.ok) throw new Error('Error al conectar con la hoja de Google Sheets');
        
        const csvText = await response.text();
        allProducts = parseCSV(csvText);
        drawCards(allProducts);
      } catch (error) {
        console.error('Error cargando el catálogo:', error);
        const grid = document.getElementById('productGrid');
        if (grid) {
          grid.innerHTML = '<p class="text-red-400 text-center col-span-full py-10">Error al cargar los productos. Asegúrate de publicar la hoja en la web como CSV.</p>';
        }
      }
    }

    // Iniciar la carga al abrir la página
    document.addEventListener('DOMContentLoaded', loadProducts);
  </script>
</body>
</html>
