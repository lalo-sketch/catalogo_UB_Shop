
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Catálogo - Joyería & Accesorios</title>
  <!-- Tailwind CSS para el diseño elegante -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;1,400&family=Plus+Jakarta+Sans:wght@300;400;600&display=swap');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fdfbf7; }
    h1, h2, h3, .brand-font { font-family: 'Playfair Display', serif; }
  </style>
</head>
<body class="text-gray-800 antialiased">

  <!-- ENCABEZADO / BRANDING -->
  <header class="bg-white border-b border-amber-100 sticky top-0 z-50 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-4 text-center">
      <h1 class="text-3xl font-bold tracking-wide text-amber-900">AURORA</h1>
      <p class="text-xs uppercase tracking-widest text-amber-600 mt-1">Joyería & Accesorios</p>
    </div>
    
    <!-- BARRA DE BÚSQUEDA Y FILTROS -->
    <div class="max-w-6xl mx-auto px-4 pb-4 pt-2">
      <div class="relative">
        <input type="text" id="searchInput" onkeyup="filterProducts()" placeholder="Buscar joyas, gorras, cadenas..." 
               class="w-full pl-10 pr-4 py-2 bg-amber-50/50 border border-amber-200 rounded-full text-sm focus:outline-none focus:ring-2 focus:ring-amber-500">
        <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-amber-400"></i>
      </div>
    </div>
  </header>

  <!-- CONTENEDOR DE PRODUCTOS -->
  <main class="max-w-6xl mx-auto px-4 py-8">
    <div id="productGrid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-6">
      <!-- Los productos de Google Sheets se cargarán automáticamente aquí -->
      <p class="col-span-full text-center text-gray-500 py-10">Cargando catálogo...</p>
    </div>
  </main>

  <!-- SCRIPT PARA CONECTAR GOOGLE SHEETS -->
  <script>
    // AQUÍ PEGARÁS EL ENLACE DE TU GOOGLE SHEETS MÁS ADELANTE
    const SHEET_CSV_URL = ''; 
    const PHONE_NUMBER = '521XXXXXXXXXX'; // Tu número de WhatsApp con clave de país

    // Datos de demostración mientras conectas el Sheets
    const demoProducts = [
      { sku: 'CAD-01', name: 'Cadena Chapa de Oro', category: 'Cadenas', price: 299, image: 'https://images.unsplash.com/photo-1599643478518-a784e5dc4c8f?w=400' },
      { sku: 'ANI-02', name: 'Anillo Ajustable Brillo', category: 'Anillos', price: 180, image: 'https://images.unsplash.com/photo-1605100804763-247f67b3557e?w=400' },
      { sku: 'GOR-01', name: 'Gorra Rosa Velvet', category: 'Gorras', price: 250, image: 'https://images.unsplash.com/photo-1588850561407-ed78c282e89b?w=400' }
    ];

    function renderProducts(products) {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '';

      products.forEach(p => {
        const message = encodeURIComponent(¡Hola! Me interesa comprar el producto: ${p.name} (SKU: ${p.sku}) con precio de $${p.price} MXN.);
        const whatsappUrl = https://wa.me/${PHONE_NUMBER}?text=${message};

        grid.innerHTML += `
          <div class="product-card bg-white border border-amber-100 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition-all duration-300 flex flex-col justify-between" data-name="${p.name.toLowerCase()}">
            <div class="relative overflow-hidden bg-gray-100 aspect-square">
              <img src="${p.image}" alt="${p.name}" class="w-full h-full object-cover">
            </div>
            <div class="p-4 flex-1 flex flex-col justify-between">
              <div>
                <span class="text-[10px] uppercase tracking-wider font-semibold text-amber-600">${p.category}</span>
                <h3 class="font-medium text-gray-800 text-sm mt-1 line-clamp-2">${p.name}</h3>
              </div>
              <div class="mt-4">
                <p class="text-lg font-bold text-gray-900">$$
